name: macOS build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test release-check failure paths
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate bilingual source and release metadata
        run: python3 scripts/validate-release.py --source-only
      - name: Run isolated regression tests
        run: >-
          xcodebuild test
          -project LumenFocus/LumenFocus.xcodeproj
          -scheme LumenFocus
          -configuration Debug
          -destination 'platform=macOS'
          -parallel-testing-enabled NO
          -derivedDataPath "$RUNNER_TEMP/LumenFocus-build"
          -resultBundlePath "$RUNNER_TEMP/LumenFocus-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Archive universal unsigned Release
        run: >-
          xcodebuild archive
          -project LumenFocus/LumenFocus.xcodeproj
          -scheme LumenFocus
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/LumenFocus-build"
          -archivePath "$RUNNER_TEMP/LumenFocus.xcarchive"
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
      - name: Validate and package internal-test artifact
        run: >-
          python3 scripts/package-unsigned.py
          --app "$RUNNER_TEMP/LumenFocus.xcarchive"
          --output "$RUNNER_TEMP/LumenFocus-unsigned-artifacts"
      - name: Keep unsigned internal-test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LumenFocus-unsigned-not-for-distribution
          path: |
            ${{ runner.temp }}/LumenFocus-unsigned-artifacts/*.zip
            ${{ runner.temp }}/LumenFocus-unsigned-artifacts/*.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/LumenFocus-tests.xcresult
          retention-days: 7
          if-no-files-found: warn
