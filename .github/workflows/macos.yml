name: macOS build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Run isolated regression tests
        run: >-
          xcodebuild test
          -project LumenFocus/LumenFocus.xcodeproj
          -scheme LumenFocus
          -configuration Debug
          -destination 'platform=macOS'
          -parallel-testing-enabled NO
          -derivedDataPath "$RUNNER_TEMP/LumenFocus-build"
          -resultBundlePath "$RUNNER_TEMP/LumenFocus-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Build universal Release
        run: >-
          xcodebuild build
          -project LumenFocus/LumenFocus.xcodeproj
          -scheme LumenFocus
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/LumenFocus-build"
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/LumenFocus-tests.xcresult
          retention-days: 7
          if-no-files-found: warn
